# Compila Paciente Cero en cada push a main:
#  - Web (HTML5) → se publica en GitHub Pages (jugable desde el celular)
#  - Android → APK de prueba (debug) descargable desde la pestaña Actions
name: Build y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache de Godot y plantillas
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable

      - name: Descargar Godot y plantillas de exportación
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip && rm Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz \
            'templates/web_nothreads_release.zip' 'templates/android_debug.apk' 'templates/android_release.apk' \
            'templates/android_source.zip' 'templates/version.txt'
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf templates Godot_v${GODOT_VERSION}-stable_export_templates.tpz

      - name: Importar proyecto
        run: ~/godot/godot --headless --path . --import || true

      - name: Exportar Web
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          touch build/web/.nojekyll

      - name: Preparar firma debug de Android
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore ~/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^          //' ~/.config/godot/editor_settings-${GODOT_VERSION}.tres
          cat ~/.config/godot/editor_settings-${GODOT_VERSION}.tres

      - name: Exportar APK de prueba (Android)
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/../debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          cp ~/debug.keystore ${{ github.workspace }}/../debug.keystore
          mkdir -p build/android
          ~/godot/godot --headless --path . --export-debug "Android" build/android/PacienteCero-debug.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PacienteCero-android-debug
          path: build/android/PacienteCero-debug.apk

      - name: Subir sitio web para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
